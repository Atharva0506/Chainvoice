# =============================================================================
# PR Preview — Full Web3 Stack (Anvil + Cloudflare Tunnel)
#
# Spins up a complete Web3 development environment:
#   1. Anvil local blockchain (chain ID 31337)
#   2. Deploys Chainvoice.sol contract
#   3. Starts Vite dev server connected to Anvil
#   4. Creates two Cloudflare tunnels (frontend + Anvil RPC)
#
# Maintainer-triggered only (workflow_dispatch) because:
# - Longer runtime (~5 min setup, up to 60 min alive)
# - Requires Foundry toolchain installation
# - Two tunnels = more resource usage
#
# SECURITY NOTES:
# - Only maintainers with write access can trigger
# - Anvil private keys are publicly known dev defaults
# - No production blockchain is ever touched
# - Environments are ephemeral — destroyed when workflow stops
# =============================================================================

name: "⛓️ Web3 PR Preview (Anvil)"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to preview"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: "20"
  FRONTEND_DIR: "frontend"
  CONTRACTS_DIR: "contracts"
  # Anvil default account #0 — publicly known, safe to hardcode
  DEPLOYER_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"

jobs:
  web3-preview:
    name: "Web3 Preview PR #${{ inputs.pr_number }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── Checkout PR ─────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr checkout ${{ inputs.pr_number }}
          echo "PR_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "PR_BRANCH=$(git branch --show-current)" >> $GITHUB_ENV

      # ── Foundry + Node.js ─────────────────────────────────────────────────
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm i

      # ── Start Services & Deploy ───────────────────────────────────────────
      - name: Start Services, Deploy, and Keep Alive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}
          VITE_CONTRACT_ADDRESS_11155111: "0x54a542dCDC306eE281b5De4613EcEfe6e6ABc562"
          VITE_CONTRACT_ADDRESS_61: "0xD044A85a5daC307217B9bF313A90E8a60AF7DdCe"
          VITE_CONTRACT_ADDRESS_137: "0xD044A85a5daC307217B9bF313A90E8a60AF7DdCe"
          VITE_LIT_BYPASS: "true"
        run: |
          echo "Starting Anvil blockchain..."
          anvil --host 0.0.0.0 --port 8545 > anvil.log 2>&1 &
          
          for i in $(seq 1 15); do
            if curl -s -X POST http://localhost:8545 -H "Content-Type: application/json" --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' > /dev/null 2>&1; then
              echo "✅ Anvil ready"
              break
            fi
            sleep 1
          done
          
          echo "Deploying Chainvoice contract..."
          cd ${{ env.CONTRACTS_DIR }}
          forge script script/Chaivoice.s.sol --rpc-url http://localhost:8545 --private-key ${{ env.DEPLOYER_PRIVATE_KEY }} --broadcast
          CONTRACT_ADDRESS="0x5FbDB2315678afecb367f032d93F642f64180aa3"
          echo "✅ Contract deployed to $CONTRACT_ADDRESS"
          cd ../${{ env.FRONTEND_DIR }}
          
          echo "Starting Vite dev server..."
          export VITE_CONTRACT_ADDRESS_31337=$CONTRACT_ADDRESS
          npm run dev -- --host 0.0.0.0 > server.log 2>&1 &
          
          for i in $(seq 1 30); do
            if curl -s http://localhost:5173 > /dev/null 2>&1; then
              echo "✅ Frontend ready"
              break
            fi
            sleep 2
          done
          
          echo "Starting Cloudflare Tunnels..."
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          
          ./cloudflared tunnel --url http://localhost:5173 > fe-tunnel.log 2>&1 &
          ./cloudflared tunnel --url http://localhost:8545 > anvil-tunnel.log 2>&1 &
          
          echo "Waiting for tunnel URLs..."
          for i in $(seq 1 30); do
            FE_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' fe-tunnel.log | head -1)
            if [ -n "$FE_URL" ]; then break; fi
            sleep 2
          done
          
          for i in $(seq 1 30); do
            ANVIL_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' anvil-tunnel.log | head -1)
            if [ -n "$ANVIL_URL" ]; then break; fi
            sleep 2
          done
          
          echo "Frontend: $FE_URL"
          echo "Anvil: $ANVIL_URL"
          
          echo "Posting PR comment..."
          COMMENT_BODY="## ⛓️ Web3 Preview

          | Service | URL |
          |---------|-----|
          | **Frontend** | $FE_URL |
          | **Anvil RPC** | $ANVIL_URL |

          > ⚠️ Both tunnels are **live only while the workflow runs** (max 60 min).

          ### 🦊 MetaMask Setup
          1. Add network → RPC: \`$ANVIL_URL\` · Chain ID: \`31337\` · Symbol: \`ETH\`
          2. Import key: \`0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80\` (10k ETH)
          3. Open frontend → connect wallet → switch to Anvil

          | Detail | Value |
          |--------|-------|
          | Contract | \`$CONTRACT_ADDRESS\` |
          | Commit | \`${{ env.PR_SHA }}\` |
          | Workflow | [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

          ---
          *🤖 Powered by Foundry Anvil + Cloudflare Quick Tunnel (free, no accounts)*"
          
          gh pr comment ${{ inputs.pr_number }} --body "$COMMENT_BODY" || echo "Warning: Failed to post PR comment"
          
          echo "🟢 Web3 Preview is LIVE!"
          sleep 3600

      # ── Cleanup Comment ────────────────────────────────────────────────────────
      - name: Cleanup PR Preview Comment
        if: cancelled() || failure() || success()
        run: |
          COMMENT_BODY="## 🛑 Web3 Preview Stopped
          
          The preview environment for this PR has been closed. 
          Run the workflow again to spin up a new instance."
          
          gh pr comment ${{ inputs.pr_number }} --body "$COMMENT_BODY" || echo "Warning: Failed to post PR comment"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
